name: Verify Migrations

on:
  pull_request:
    branches: [main, 'release/**']
    paths: ['supabase/migrations/**']
  workflow_dispatch:

jobs:
  verify-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.103.0
      - run: supabase start
      - run: supabase db reset
