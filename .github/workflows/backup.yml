# SUPABASE_DB_POOLER_URL secret format:
#   postgresql://postgres.[project-ref]:[password]@aws-0-[region].pooler.supabase.com:5432/postgres
# Find it in Supabase dashboard → Connect button (top of project overview) → Session mode (port 5432, pooled).
# Use the session-mode pooler URL (not the direct connection URI) — the direct host is IPv6-only and
# unreachable from GitHub Actions runners. URL-encode any special characters in the password (e.g. @ → %40, # → %23).

name: Nightly DB Backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17

      - name: Dump database
        env:
          SUPABASE_DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
        run: /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_POOLER_URL" --format=custom --no-acl --no-owner -f backup.dump

      - name: Upload artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: db-backup-${{ github.run_id }}
          path: backup.dump
          retention-days: 30
