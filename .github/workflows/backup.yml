# SUPABASE_DB_URL secret format:
#   postgresql://postgres:[password]@db.[project-ref].supabase.co:5432/postgres
# Find it in Supabase dashboard → Connect button (top of project overview) → Direct connection URI (port 5432, not pooled).

name: Nightly DB Backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Dump database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: pg_dump "$SUPABASE_DB_URL" --format=custom --no-acl --no-owner -f backup.dump

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup.dump
          retention-days: 30
