name: CI

on:
  pull_request:
    branches: [main, 'release/**']
  push:
    branches: [main, 'release/**']

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash scripts/ci.sh

  e2e:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Wait for Vercel preview deployment
        id: vercel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          PREVIEW_URL=""
          for i in $(seq 1 30); do
            DEPLOY_ID=$(gh api "repos/${{ github.repository }}/deployments?ref=$SHA&per_page=10" \
              --jq '[.[] | select(.environment | startswith("Preview"))] | .[0].id // empty' 2>/dev/null || echo "")
            if [ -n "$DEPLOY_ID" ]; then
              STATE=$(gh api "repos/${{ github.repository }}/deployments/$DEPLOY_ID/statuses" \
                --jq '.[0].state // "pending"' 2>/dev/null || echo "pending")
              URL=$(gh api "repos/${{ github.repository }}/deployments/$DEPLOY_ID/statuses" \
                --jq '.[0].target_url // ""' 2>/dev/null || echo "")
              if [ "$STATE" = "success" ] && [ -n "$URL" ]; then
                PREVIEW_URL="$URL"
                echo "PREVIEW_URL=$URL" >> "$GITHUB_OUTPUT"
                break
              elif [ "$STATE" = "failure" ] || [ "$STATE" = "error" ]; then
                echo "Vercel deployment failed" >&2; exit 1
              fi
            fi
            echo "Attempt $i/30 — waiting 20s..."
            sleep 20
          done
          [ -n "$PREVIEW_URL" ] || { echo "Timed out waiting for Vercel preview deployment" >&2; exit 1; }

      - name: Write .env.local from secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          ANON_KEY=$(curl -sf \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys" \
            | jq -r '.[] | select(.name == "anon") | .api_key')
          echo "::add-mask::$ANON_KEY"
          printf 'NEXT_PUBLIC_SUPABASE_URL=https://%s.supabase.co\nNEXT_PUBLIC_SUPABASE_ANON_KEY=%s\nVERCEL_AUTOMATION_BYPASS_SECRET=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\n' \
            "$SUPABASE_PROJECT_REF" "$ANON_KEY" "$VERCEL_AUTOMATION_BYPASS_SECRET" "$SUPABASE_SERVICE_ROLE_KEY" \
            > .env.local

      - run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: bash scripts/run-smoke-tests.sh "${{ steps.vercel.outputs.PREVIEW_URL }}" "e2e-stable"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
