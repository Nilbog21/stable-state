name: CI

on:
  pull_request:
    branches: [main, 'release/**']
  push:
    branches: [main, 'release/**']

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash scripts/ci.sh
