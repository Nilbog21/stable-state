name: E2E

on:
  pull_request:
    types: [opened, synchronize, labeled]
    branches: [main, 'release/**']

jobs:
  e2e:
    runs-on: ubuntu-latest
    if: >-
      contains(github.event.pull_request.labels.*.name, 'smoke-test') &&
      (github.event.action != 'labeled' || github.event.label.name == 'smoke-test')
    concurrency:
      group: e2e-shared-barn
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Wait for CI to pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.event.pull_request.head.sha }}"
          STATUS=""
          CONCLUSION=""
          for i in $(seq 1 30); do
            RESULT=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs" \
              --jq '[.check_runs[] | select(.name=="ci")] | sort_by(.started_at) | last | (.status + " " + (.conclusion // "null"))' 2>/dev/null || echo "")
            STATUS=$(echo "$RESULT" | cut -d' ' -f1)
            CONCLUSION=$(echo "$RESULT" | cut -d' ' -f2)
            if [ "$STATUS" = "completed" ]; then
              [ "$CONCLUSION" = "success" ] && break
              echo "ci check run concluded '$CONCLUSION' for $SHA" >&2; exit 1
            fi
            echo "Attempt $i/30 — ci still ${STATUS:-not started}, waiting 20s..."
            sleep 20
          done
          [ "$STATUS" = "completed" ] && [ "$CONCLUSION" = "success" ] || { echo "Timed out waiting for ci check run" >&2; exit 1; }

      - name: Wait for Vercel preview deployment
        id: vercel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          PREVIEW_URL=""
          for i in $(seq 1 30); do
            DEPLOY_ID=$(gh api "repos/${{ github.repository }}/deployments?ref=$SHA&per_page=10" \
              --jq '[.[] | select(.environment | startswith("Preview"))] | .[0].id // empty' 2>/dev/null || echo "")
            if [ -n "$DEPLOY_ID" ]; then
              STATE=$(gh api "repos/${{ github.repository }}/deployments/$DEPLOY_ID/statuses" \
                --jq '.[0].state // "pending"' 2>/dev/null || echo "pending")
              URL=$(gh api "repos/${{ github.repository }}/deployments/$DEPLOY_ID/statuses" \
                --jq '.[0].target_url // ""' 2>/dev/null || echo "")
              if [ "$STATE" = "success" ] && [ -n "$URL" ]; then
                PREVIEW_URL="$URL"
                echo "PREVIEW_URL=$URL" >> "$GITHUB_OUTPUT"
                break
              elif [ "$STATE" = "failure" ] || [ "$STATE" = "error" ]; then
                echo "Vercel deployment failed" >&2; exit 1
              fi
            fi
            echo "Attempt $i/30 — waiting 20s..."
            sleep 20
          done
          [ -n "$PREVIEW_URL" ] || { echo "Timed out waiting for Vercel preview deployment" >&2; exit 1; }

      - name: Set env vars from secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_DEV_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_DEV_SERVICE_ROLE_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          ANON_KEY=$(curl -sf \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys" \
            | jq -r '.[] | select(.name == "anon") | .api_key')
          [ -n "$ANON_KEY" ] || { echo "Failed to fetch anon key from Supabase API" >&2; exit 1; }
          echo "::add-mask::$ANON_KEY"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=https://$SUPABASE_PROJECT_REF.supabase.co"
            echo "DEV_SUPABASE_URL=https://$SUPABASE_PROJECT_REF.supabase.co"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "VERCEL_AUTOMATION_BYPASS_SECRET=$VERCEL_AUTOMATION_BYPASS_SECRET"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: bash scripts/run-smoke-tests.sh --skip-env-local-check "${{ steps.vercel.outputs.PREVIEW_URL }}" "e2e-stable"

      - name: Teardown test barn
        if: always()
        run: bash scripts/teardown-test-barn.sh --skip-env-local-check e2e-stable

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
